name: Build and Push Docker Images new

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '**/README.md'
      - '**/readme.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all services'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  debug-event:
    name: Debug Event Information
    if: github.event_name == 'workflow_dispatch' || true()
    runs-on: ubuntu-latest
    steps:
      - name: Print event details
        run: |
          echo "================================"
          echo "Event Information"
          echo "================================"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo ""
          echo "Commit message:"
          echo "${{ github.event.head_commit.message }}"
          echo "================================"

  detect-changes:
    name: Detect Changed Services
    needs: debug-event
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
      image_prefix: ${{ steps.detect.outputs.image_prefix }}
      commit_message: ${{ steps.detect.outputs.commit_message }}
      commit_author: ${{ steps.detect.outputs.commit_author }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          # Get the actual git commit SHA
          GIT_COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA="${GIT_COMMIT_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "🔖 Git Commit SHA: $SHORT_SHA"
          echo "📌 Full Git SHA: $GIT_COMMIT_SHA"
          
          # Get commit message and author
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "commit_message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          
          echo "👤 Commit author: $COMMIT_AUTHOR"
          echo "💬 Commit message: $COMMIT_MESSAGE"
          
          # Convert repository name to lowercase for Docker
          IMAGE_PREFIX=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=$IMAGE_PREFIX" >> $GITHUB_OUTPUT
          echo "📦 Image prefix: $IMAGE_PREFIX"
          
          # Detect backend and frontend services
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "🔄 Force rebuild enabled - all services will be built"
            BACKEND_SERVICES=$(find services -maxdepth 1 -type d ! -path services -exec basename {} \; 2>/dev/null | jq -R -s -c 'split("\n")[:-1]' || echo '[]')
            if [ -d "frontend" ]; then
              FRONTEND_SERVICES=$(find frontend -maxdepth 1 -type d ! -path frontend -exec basename {} \; 2>/dev/null | jq -R -s -c 'split("\n")[:-1]' || echo '[]')
            else
              FRONTEND_SERVICES='[]'
            fi
          else
            echo "📝 Detecting changed files..."
            # For push events, compare previous commit with current
            if [ "${{ github.event_name }}" == "push" ]; then
              # Get the previous commit (for push events to main)
              PREVIOUS_SHA="${{ github.event.before }}"
              CURRENT_SHA="${{ github.sha }}"
              
              if [ -n "$PREVIOUS_SHA" ] && [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]; then
                echo "Comparing: $PREVIOUS_SHA..$CURRENT_SHA"
                CHANGED_FILES=$(git diff --name-only $PREVIOUS_SHA..$CURRENT_SHA 2>/dev/null || echo "")
                
                if [ -z "$CHANGED_FILES" ]; then
                  # If diff fails (e.g., shallow clone), try alternative approach
                  echo "Using alternative method to detect changes"
                  CHANGED_FILES=$(git log --oneline --name-only -1 --pretty=format:"" $CURRENT_SHA | grep -v '^$' || echo "")
                fi
              else
                echo "First commit or no previous SHA, checking current commit only"
                CHANGED_FILES=$(git log --oneline --name-only -1 --pretty=format:"" $CURRENT_SHA | grep -v '^$' || echo "")
              fi
            else
              # For workflow_dispatch without force rebuild
              CHANGED_FILES=$(git diff --name-only HEAD^..HEAD 2>/dev/null || echo "")
            fi
            
            echo ""
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo ""
            
            BACKEND_SERVICES=$(echo "$CHANGED_FILES" | grep "^services/" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1] | map(select(length>0))' || echo '[]')
            FRONTEND_SERVICES=$(echo "$CHANGED_FILES" | grep "^frontend/" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1] | map(select(length>0))' || echo '[]')
          fi
          
          # Handle empty arrays
          if [ -z "$BACKEND_SERVICES" ] || [ "$BACKEND_SERVICES" == "null" ]; then
            BACKEND_SERVICES='[]'
          fi
          if [ -z "$FRONTEND_SERVICES" ] || [ "$FRONTEND_SERVICES" == "null" ]; then
            FRONTEND_SERVICES='[]'
          fi
          
          echo "🎯 Backend services: $BACKEND_SERVICES"
          echo "🎯 Frontend services: $FRONTEND_SERVICES"
          
          # Combine into a single matrix with type information
          MATRIX=$(jq -nc --argjson backend "$BACKEND_SERVICES" --argjson frontend "$FRONTEND_SERVICES" '{"include":(($backend|map({service:.,type:"backend",path:("services/"+.)}))+($frontend|map({service:.,type:"frontend",path:("frontend/"+.)})))}')
          
          # Output the matrix as a single line (critical for GITHUB_OUTPUT)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          
          # Check if we have any services to build
          SERVICE_COUNT=$(echo "$MATRIX" | jq '.include | length')
          if [ "$SERVICE_COUNT" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Found $SERVICE_COUNT service(s) to build"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No services to build"
          fi
          
          echo ""
          echo "📋 Build Matrix:"
          echo "$MATRIX" | jq .

  build-services:
    name: Build ${{ matrix.type }} - ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          SERVICE="${{ matrix.service }}"
          TYPE="${{ matrix.type }}"
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          # Organize images into backend/ or frontend/ folders
          IMAGE="${{ env.REGISTRY }}/${{ needs.detect-changes.outputs.image_prefix }}/${TYPE}/${SERVICE}"
          
          # Set context path based on type
          if [ "$TYPE" == "frontend" ]; then
            CONTEXT="./frontend/$SERVICE"
          else
            CONTEXT="./services/$SERVICE"
          fi
          
          echo "🔨 Building $TYPE service: $SERVICE"
          echo "📂 Context: $CONTEXT"
          echo "🔖 SHA: $SHORT_SHA"
          echo "📦 Image: $IMAGE"
          echo "🐳 Tag: ${IMAGE}:${SHORT_SHA}"
          
          # Build and push with SHA tag
          docker buildx build \
            --platform linux/amd64 \
            --tag ${IMAGE}:${SHORT_SHA} \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.title=$SERVICE" \
            --label "org.opencontainers.image.description=$TYPE service: $SERVICE" \
            --push \
            ${CONTEXT}
          
          echo "✅ Build completed successfully!"

      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERVICE="${{ matrix.service }}"
          TYPE="${{ matrix.type }}"
          # Package name includes the folder structure (URL encoded)
          PACKAGE_NAME="${TYPE}%2F${SERVICE}"
          REPO_OWNER="${{ github.repository_owner }}"
          
          echo "🔓 Setting package visibility to public for: ${TYPE}/${SERVICE}"
          echo "📦 Package name: $PACKAGE_NAME"
          echo "👤 Owner: $REPO_OWNER"
          
          # Try organization endpoint first
          echo "Trying organization endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" \
            -d '{"visibility":"public"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ Package visibility set to public (org endpoint)"
          else
            echo "Organization endpoint returned: $HTTP_CODE"
            echo "Trying user endpoint..."
            
            # Try user endpoint
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" \
              -d '{"visibility":"public"}')
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
              echo "✅ Package visibility set to public (user endpoint)"
            else
              echo "⚠️  Could not set visibility automatically (HTTP $HTTP_CODE)"
              echo "💡 You may need to manually set it to public in package settings"
            fi
          fi

      - name: Display image information
        run: |
          SERVICE="${{ matrix.service }}"
          TYPE="${{ matrix.type }}"
          IMAGE="${{ env.REGISTRY }}/${{ needs.detect-changes.outputs.image_prefix }}/${TYPE}/${SERVICE}"
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Successfully built and pushed [$TYPE]"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Service:     $SERVICE"
          echo "🧩 Type:        $TYPE"
          echo "🔖 Commit SHA:  $SHORT_SHA"
          echo "📌 Full SHA:    ${{ github.sha }}"
          echo ""
          echo "🐳 Image:"
          echo "   ${IMAGE}:${SHORT_SHA}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Save build metadata
        run: |
          mkdir -p build-artifacts
          SERVICE="${{ matrix.service }}"
          TYPE="${{ matrix.type }}"
          IMAGE="${{ env.REGISTRY }}/${{ needs.detect-changes.outputs.image_prefix }}/${TYPE}/${SERVICE}"
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          
          cat > build-artifacts/${TYPE}-${SERVICE}.json << EOF
          {
            "service": "$SERVICE",
            "type": "$TYPE",
            "image": "${IMAGE}:${SHORT_SHA}",
            "tags": {
              "sha": "$SHORT_SHA",
              "full_sha": "${{ github.sha }}"
            },
            "sha": "${{ github.sha }}",
            "short_sha": "$SHORT_SHA",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "triggered_by": "${{ github.actor }}",
            "workflow_run": "${{ github.run_id }}",
            "path": "${{ matrix.path }}",
            "commit_author": "${{ needs.detect-changes.outputs.commit_author }}"
          }
          EOF

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-meta-${{ matrix.type }}-${{ matrix.service }}
          path: build-artifacts/${{ matrix.type }}-${{ matrix.service }}.json
          retention-days: 90

  summary:
    name: Build Summary
    needs: [detect-changes, build-services]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download build metadata
        if: needs.detect-changes.outputs.has_changes == 'true' && needs.build-services.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: build-meta-*
          path: build-artifacts
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "# 🚀 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ needs.detect-changes.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Full SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ needs.detect-changes.outputs.commit_author }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          
          # Get first line of commit message
          COMMIT_MSG=$(echo "${{ needs.detect-changes.outputs.commit_message }}" | head -1)
          echo "**Commit:** $COMMIT_MSG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.has_changes }}" == "true" ] && [ "${{ needs.build-services.result }}" == "success" ]; then
            echo "## ✅ Built Services" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Backend services
            if ls build-artifacts/backend-*.json 1> /dev/null 2>&1; then
              echo "### 🔷 Backend Services" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Service | Commit SHA | Image |" >> $GITHUB_STEP_SUMMARY
              echo "|---------|------------|-------|" >> $GITHUB_STEP_SUMMARY
              
              for f in build-artifacts/backend-*.json; do
                SERVICE=$(jq -r '.service' "$f")
                SHA=$(jq -r '.short_sha' "$f")
                IMAGE=$(jq -r '.image' "$f")
                echo "| **$SERVICE** | \`$SHA\` | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Frontend services
            if ls build-artifacts/frontend-*.json 1> /dev/null 2>&1; then
              echo "### 🔶 Frontend Services" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Service | Commit SHA | Image |" >> $GITHUB_STEP_SUMMARY
              echo "|---------|------------|-------|" >> $GITHUB_STEP_SUMMARY
              
              for f in build-artifacts/frontend-*.json; do
                SERVICE=$(jq -r '.service' "$f")
                SHA=$(jq -r '.short_sha' "$f")
                IMAGE=$(jq -r '.image' "$f")
                echo "| **$SERVICE** | \`$SHA\` | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "## 📋 Tags" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Each service is tagged with its commit SHA:" >> $GITHUB_STEP_SUMMARY
            echo "- **\`${{ needs.detect-changes.outputs.short_sha }}\`**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "## 🔧 Pull Commands" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            for f in build-artifacts/*.json; do
              IMAGE=$(jq -r '.image' "$f")
              echo "docker pull $IMAGE" >> $GITHUB_STEP_SUMMARY
            done
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
          elif [ "${{ needs.detect-changes.outputs.has_changes }}" == "false" ]; then
            echo "## ℹ️ No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No services were modified. No builds triggered." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 Use manual trigger with 'Force rebuild' to rebuild all services." >> $GITHUB_STEP_SUMMARY
            
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some builds failed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Console summary
        if: needs.detect-changes.outputs.has_changes == 'true' && needs.build-services.result == 'success'
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    BUILD SUMMARY                               ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔖 Commit SHA: ${{ needs.detect-changes.outputs.short_sha }}"
          echo "📌 Full SHA:   ${{ github.sha }}"
          echo "👤 Author:     ${{ needs.detect-changes.outputs.commit_author }}"
          echo ""
          
          # Backend
          if ls build-artifacts/backend-*.json 1> /dev/null 2>&1; then
            echo "🔷 BACKEND SERVICES:"
            echo ""
            for f in build-artifacts/backend-*.json; do
              SERVICE=$(jq -r '.service' "$f")
              SHA=$(jq -r '.short_sha' "$f")
              IMAGE=$(jq -r '.image' "$f")
              echo "  📦 $SERVICE"
              echo "     🔖 SHA: $SHA"
              echo "     🐳 $IMAGE"
              echo ""
            done
          fi
          
          # Frontend
          if ls build-artifacts/frontend-*.json 1> /dev/null 2>&1; then
            echo "🔶 FRONTEND SERVICES:"
            echo ""
            for f in build-artifacts/frontend-*.json; do
              SERVICE=$(jq -r '.service' "$f")
              SHA=$(jq -r '.short_sha' "$f")
              IMAGE=$(jq -r '.image' "$f")
              echo "  📦 $SERVICE"
              echo "     🔖 SHA: $SHA"
              echo "     🐳 $IMAGE"
              echo ""
            done
          fi
          
          echo "✅ All builds completed successfully!"
          echo ""
          echo "Pull images using:"
          for f in build-artifacts/*.json; do
            IMAGE=$(jq -r '.image' "$f")
            echo "  docker pull $IMAGE"
          done
          echo ""
